[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refusalclimb"
version = "0.1.0"
description = "Refusal-guided discovery of jailbreak classes, demonstrated on a fully-offline benign proxy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishnu Kosuri" }]
keywords = ["ai-safety", "red-team", "jailbreak", "interpretability", "refusal-direction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

# Runtime dependency is numpy ONLY. transformers / torch / sentence-transformers
# are intentionally NOT here: they are gated behind `# TODO(real):` markers so the
# package runs FULLY OFFLINE (no downloads, no GPU, no API keys).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
refusalclimb = "refusalclimb.cli:main"

[project.urls]
Homepage = "https://github.com/VISHNU0906/refusal-climb"

[tool.setuptools.packages.find]
include = ["refusalclimb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
